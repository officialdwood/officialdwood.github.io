<!DOCTYPE html>
<html>
<head>
    <title>Current Building View</title>
    <style>
        body { margin: 20px; font-family: Arial; background: #f0f0f0; }
        canvas { border: 2px solid #ccc; background: white; display: block; margin: 20px auto; }
        .info { text-align: center; margin: 20px; }
    </style>
</head>
<body>
    <h2 style="text-align: center;">Current Building View</h2>
    <div class="info">
        <p><strong>Current Settings:</strong></p>
        <p>Rotation Y: 0° (looking at gable) | Rotation X: 20° (tilted down)</p>
    </div>
    <canvas id="canvas" width="800" height="600"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        const params = {
            width: 20,
            length: 40,
            height: 12,
            pitch: 4,
            rotationY: 0,
            rotationX: 20,
            zoom: 1
        };
        
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Background
            ctx.fillStyle = '#F5F5F5';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Ground
            ctx.fillStyle = '#D3D3D3';
            ctx.fillRect(0, canvas.height - 80, canvas.width, 80);
            
            const scale = 6 * params.zoom;
            const roofPeakHeight = (params.width / 2) * (params.pitch / 12);
            const totalHeight = params.height + roofPeakHeight;
            
            const availableHeight = canvas.height - 80;
            const buildingHeightPixels = totalHeight * scale;
            const offsetX = canvas.width / 2;
            const offsetY = (availableHeight + buildingHeightPixels) / 2;
            
            const width = params.width * scale;
            const length = params.length * scale;
            const wallHeight = params.height * scale;
            const roofPeak = roofPeakHeight * scale;
            
            const rotYRad = (params.rotationY * Math.PI) / 180;
            const rotXRad = (params.rotationX * Math.PI) / 180;
            const isoAngle = Math.PI / 6;
            
            const project = (x, y, z) => {
                // Y-axis rotation
                let rotX = x * Math.cos(rotYRad) - y * Math.sin(rotYRad);
                let rotY = x * Math.sin(rotYRad) + y * Math.cos(rotYRad);
                let rotZ = z;
                
                // X-axis rotation
                const tempY = rotY;
                const tempZ = rotZ;
                rotY = tempY * Math.cos(rotXRad) - tempZ * Math.sin(rotXRad);
                rotZ = tempY * Math.sin(rotXRad) + tempZ * Math.cos(rotXRad);
                
                // Isometric projection
                const isoX = rotX * Math.cos(isoAngle) - rotY * Math.cos(isoAngle);
                const isoY = rotX * Math.sin(isoAngle) + rotY * Math.sin(isoAngle) + rotZ;
                
                return { x: offsetX + isoX, y: offsetY + isoY };
            };
            
            // Draw building
            const fbl = project(-width/2, -length/2, 0);
            const fbr = project(width/2, -length/2, 0);
            const ftl = project(-width/2, -length/2, -wallHeight);
            const ftr = project(width/2, -length/2, -wallHeight);
            const bbl = project(-width/2, length/2, 0);
            const bbr = project(width/2, length/2, 0);
            const btl = project(-width/2, length/2, -wallHeight);
            const btr = project(width/2, length/2, -wallHeight);
            const frontPeak = project(0, -length/2, -wallHeight - roofPeak);
            const backPeak = project(0, length/2, -wallHeight - roofPeak);
            
            // Front wall
            ctx.fillStyle = '#E0E0E0';
            ctx.beginPath();
            ctx.moveTo(fbl.x, fbl.y);
            ctx.lineTo(fbr.x, fbr.y);
            ctx.lineTo(ftr.x, ftr.y);
            ctx.lineTo(ftl.x, ftl.y);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            
            // Front gable
            ctx.fillStyle = '#E0E0E0';
            ctx.beginPath();
            ctx.moveTo(ftl.x, ftl.y);
            ctx.lineTo(ftr.x, ftr.y);
            ctx.lineTo(frontPeak.x, frontPeak.y);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            // Left wall
            ctx.fillStyle = '#A0A0A0';
            ctx.beginPath();
            ctx.moveTo(bbl.x, bbl.y);
            ctx.lineTo(fbl.x, fbl.y);
            ctx.lineTo(ftl.x, ftl.y);
            ctx.lineTo(btl.x, btl.y);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            // Left roof
            ctx.fillStyle = '#505050';
            ctx.beginPath();
            ctx.moveTo(ftl.x, ftl.y);
            ctx.lineTo(frontPeak.x, frontPeak.y);
            ctx.lineTo(backPeak.x, backPeak.y);
            ctx.lineTo(btl.x, btl.y);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            // Right roof
            ctx.fillStyle = '#303030';
            ctx.beginPath();
            ctx.moveTo(ftr.x, ftr.y);
            ctx.lineTo(frontPeak.x, frontPeak.y);
            ctx.lineTo(backPeak.x, backPeak.y);
            ctx.lineTo(btr.x, btr.y);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            // Ridge line
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(frontPeak.x, frontPeak.y);
            ctx.lineTo(backPeak.x, backPeak.y);
            ctx.stroke();
            
            // Labels
            ctx.fillStyle = '#FF0000';
            ctx.font = 'bold 16px Arial';
            ctx.fillText('ROOF PEAK', frontPeak.x + 20, frontPeak.y);
            ctx.fillText('GROUND', fbl.x - 80, fbl.y + 20);
        }
        
        render();
    </script>
</body>
</html>
