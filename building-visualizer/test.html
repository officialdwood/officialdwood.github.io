<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building Visualizer - Test</title>
    <style>
        body { margin: 0; padding: 20px; background: #f0f0f0; font-family: Arial, sans-serif; }
        .container { display: flex; gap: 20px; }
        .controls { flex: 0 0 300px; background: #fff; padding: 20px; border-radius: 8px; }
        .preview { flex: 1; background: #fff; padding: 20px; border-radius: 8px; }
        canvas { border: 1px solid #ddd; width: 100%; }
        input, select, button { width: 100%; margin: 5px 0; padding: 8px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        .button-group { display: flex; gap: 10px; }
        .button-group button { width: auto; flex: 1; }
    </style>
</head>
<body>
    <h2 style="text-align: center;">Building Visualizer Test</h2>
    <div class="container">
        <div class="controls">
            <h3>Dimensions</h3>
            <label>Width: <span id="width-val">20</span>'</label>
            <input type="number" id="width" value="20" min="10" max="100">
            
            <label>Length: <span id="length-val">40</span>'</label>
            <input type="number" id="length" value="40" min="10" max="100">
            
            <label>Wall Height: <span id="height-val">12</span>'</label>
            <input type="number" id="height" value="12" min="8" max="20">
            
            <label>Roof Pitch: <span id="pitch-val">4</span>:12</label>
            <input type="number" id="pitch" value="4" min="1" max="12" step="0.5">
            
            <h3>Wainscott</h3>
            <label><input type="checkbox" id="wainscott-enabled" checked> Enable</label>
            <label>Height: <span id="wainscott-height-val">3</span>'</label>
            <input type="number" id="wainscott-height" value="3" min="0" max="8" step="0.5">
            
            <h3>View</h3>
            <label>Rotation: <span id="rotation-val">30</span>°</label>
            <input type="range" id="rotation" min="0" max="360" value="30" step="5">
            
            <label>Zoom: <span id="zoom-val">100</span>%</label>
            <input type="range" id="zoom" min="0.5" max="3" value="1" step="0.1">
            
            <div class="button-group">
                <button onclick="zoomIn()">Zoom In</button>
                <button onclick="zoomOut()">Zoom Out</button>
            </div>
        </div>
        <div class="preview">
            <canvas id="canvas" width="800" height="600"></canvas>
        </div>
    </div>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        const params = {
            width: 20,
            length: 40,
            height: 12,
            pitch: 4,
            wainscottEnabled: true,
            wainscottHeight: 3,
            rotation: 30,
            zoom: 1
        };
        
        function update(id, value) {
            params[id] = parseFloat(value);
            document.getElementById(id + '-val').textContent = id === 'zoom' ? Math.round(value * 100) : value;
            render();
        }
        
        function zoomIn() {
            params.zoom = Math.min(3, params.zoom + 0.2);
            document.getElementById('zoom').value = params.zoom;
            document.getElementById('zoom-val').textContent = Math.round(params.zoom * 100);
            render();
        }
        
        function zoomOut() {
            params.zoom = Math.max(0.5, params.zoom - 0.2);
            document.getElementById('zoom').value = params.zoom;
            document.getElementById('zoom-val').textContent = Math.round(params.zoom * 100);
            render();
        }
        
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Background
            ctx.fillStyle = '#F5F5F5';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Ground
            ctx.fillStyle = '#D3D3D3';
            ctx.fillRect(0, canvas.height - 80, canvas.width, 80);
            
            const scale = 6 * params.zoom;
            const offsetX = canvas.width / 2;
            const offsetY = canvas.height - 100;
            
            drawBuilding(offsetX, offsetY, scale);
            drawScale(scale);
        }
        
        function drawBuilding(offsetX, offsetY, scale) {
            const width = params.width * scale;
            const length = params.length * scale;
            const wallHeight = params.height * scale;
            const wainscottHeight = params.wainscottHeight * scale;
            const roofPeak = (params.width / 2) * (params.pitch / 12) * scale;
            
            const rotRad = (params.rotation * Math.PI) / 180;
            const isoAngle = Math.PI / 6;
            
            const project = (x, y, z) => {
                const rotX = x * Math.cos(rotRad) - y * Math.sin(rotRad);
                const rotY = x * Math.sin(rotRad) + y * Math.cos(rotRad);
                const isoX = rotX * Math.cos(isoAngle) - rotY * Math.cos(isoAngle);
                const isoY = rotX * Math.sin(isoAngle) + rotY * Math.sin(isoAngle) - z;
                return { x: offsetX + isoX, y: offsetY + isoY };
            };
            
            // Corners
            const fbl = project(-width/2, -length/2, 0);
            const fbr = project(width/2, -length/2, 0);
            const bbl = project(-width/2, length/2, 0);
            const bbr = project(width/2, length/2, 0);
            const ftl = project(-width/2, -length/2, -wallHeight);
            const ftr = project(width/2, -length/2, -wallHeight);
            const btl = project(-width/2, length/2, -wallHeight);
            const btr = project(width/2, length/2, -wallHeight);
            const fwl = project(-width/2, -length/2, -wainscottHeight);
            const fwr = project(width/2, -length/2, -wainscottHeight);
            const bwl = project(-width/2, length/2, -wainscottHeight);
            const bwr = project(width/2, length/2, -wainscottHeight);
            const frontPeak = project(0, -length/2, -wallHeight - roofPeak);
            const backPeak = project(0, length/2, -wallHeight - roofPeak);
            
            const rot = params.rotation % 360;
            const showFront = rot >= 315 || rot < 135;
            const showBack = rot >= 135 && rot < 315;
            const showLeft = rot >= 45 && rot < 225;
            const showRight = rot >= 225 || rot < 45;
            
            // Back wall
            if (showBack) {
                drawFace([bbl, bbr, btr, btl], '#E0E0E0');
                if (params.wainscottEnabled) {
                    drawFace([bbl, bbr, bwr, bwl], '#8B7355');
                }
            }
            
            // Right wall  
            if (showRight) {
                drawFace([fbr, bbr, btr, ftr], '#CCCCCC');
                if (params.wainscottEnabled) {
                    drawFace([fbr, bbr, bwr, fwr], '#75614A');
                }
            }
            
            // Left wall
            if (showLeft) {
                drawFace([bbl, fbl, ftl, btl], '#CCCCCC');
                if (params.wainscottEnabled) {
                    drawFace([bbl, fbl, fwl, bwl], '#75614A');
                }
            }
            
            // Front wall
            if (showFront) {
                drawFace([fbl, fbr, ftr, ftl], '#E0E0E0');
                if (params.wainscottEnabled) {
                    drawFace([fbl, fbr, fwr, fwl], '#8B7355');
                }
            }
            
            // Roof
            drawFace([ftl, frontPeak, backPeak, btl], '#5A5A5A');
            drawFace([ftr, frontPeak, backPeak, btr], '#3A3A3A');
            
            // Ridge line
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(frontPeak.x, frontPeak.y);
            ctx.lineTo(backPeak.x, backPeak.y);
            ctx.stroke();
        }
        
        function drawFace(points, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1;
            ctx.stroke();
        }
        
        function drawScale(scale) {
            const padding = 20;
            const actualFeet = 60 / scale;
            let displayFeet = 1;
            if (actualFeet >= 2 && actualFeet < 5) displayFeet = 2;
            else if (actualFeet >= 5 && actualFeet < 10) displayFeet = 5;
            else if (actualFeet >= 10 && actualFeet < 20) displayFeet = 10;
            else if (actualFeet >= 20) displayFeet = 20;
            
            const displayLength = displayFeet * scale;
            const startX = padding;
            const startY = canvas.height - padding;
            
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(startX + displayLength, startY);
            ctx.moveTo(startX, startY - 5);
            ctx.lineTo(startX, startY + 5);
            ctx.moveTo(startX + displayLength, startY - 5);
            ctx.lineTo(startX + displayLength, startY + 5);
            ctx.stroke();
            
            ctx.font = 'bold 12px Arial';
            ctx.fillStyle = '#000';
            ctx.textAlign = 'center';
            ctx.fillText(displayFeet + "'", startX + displayLength / 2, startY - 10);
            ctx.font = '10px Arial';
            ctx.fillText('Scale: ' + Math.round(params.zoom * 100) + '%', startX + displayLength / 2, startY + 18);
        }
        
        // Event listeners
        ['width', 'length', 'height', 'pitch', 'wainscott-height', 'rotation', 'zoom'].forEach(id => {
            document.getElementById(id).addEventListener('input', (e) => update(id.replace('-', ''), e.target.value));
        });
        
        document.getElementById('wainscott-enabled').addEventListener('change', (e) => {
            params.wainscottEnabled = e.target.checked;
            render();
        });
        
        render();
    </script>
</body>
</html>
