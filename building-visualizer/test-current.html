<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building Visualizer - Current State</title>
    <style>
        body { margin: 0; padding: 20px; background: #f0f0f0; font-family: Arial, sans-serif; }
        .container { max-width: 1200px; margin: 0 auto; }
        .preview { background: #fff; padding: 20px; border-radius: 8px; }
        canvas { border: 1px solid #ddd; width: 100%; margin-bottom: 20px; }
        .controls { background: #f8f9fa; padding: 15px; border-radius: 4px; margin-bottom: 20px; }
        .controls h3 { margin: 0 0 15px 0; }
        .control-row { display: flex; gap: 20px; margin-bottom: 15px; }
        .control-group { flex: 1; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="range"] { width: 100%; }
        span { display: inline-block; margin-left: 10px; font-weight: bold; color: #007cba; }
        button { padding: 8px 16px; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="text-align: center;">Building Visualizer - Current State Test</h2>
        <div class="preview">
            <canvas id="canvas" width="800" height="600"></canvas>
            
            <div class="controls">
                <h3>View Controls</h3>
                <div class="control-row">
                    <div class="control-group">
                        <label>Rotation (Horizontal): <span id="rot-y-val">45</span>°</label>
                        <input type="range" id="rotation-y" min="0" max="360" value="45" step="5">
                    </div>
                    <div class="control-group">
                        <label>Tilt (Vertical): <span id="rot-x-val">20</span>°</label>
                        <input type="range" id="rotation-x" min="-45" max="45" value="20" step="5">
                    </div>
                </div>
                <div class="control-row">
                    <div class="control-group">
                        <label>Zoom: <span id="zoom-val">100</span>%</label>
                        <input type="range" id="zoom" min="0.5" max="3" value="1" step="0.1">
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        const params = {
            width: 20,
            length: 40,
            height: 12,
            pitch: 4,
            wainscottEnabled: true,
            wainscottHeight: 3,
            rotationY: 45,
            rotationX: 20,
            zoom: 1
        };
        
        function update(id, value) {
            params[id] = parseFloat(value);
            const valId = id.replace('rotation', 'rot').replace('Y', '-y').replace('X', '-x') + '-val';
            document.getElementById(valId).textContent = id === 'zoom' ? Math.round(value * 100) : value;
            render();
        }
        
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Background
            ctx.fillStyle = '#F5F5F5';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Ground at bottom
            ctx.fillStyle = '#D3D3D3';
            ctx.fillRect(0, canvas.height - 80, canvas.width, 80);
            
            const scale = 6 * params.zoom;
            const roofPeakHeight = (params.width / 2) * (params.pitch / 12);
            const totalHeight = params.height + roofPeakHeight;
            
            // Center the building
            const availableHeight = canvas.height - 80;
            const buildingHeightPixels = totalHeight * scale;
            const offsetX = canvas.width / 2;
            const offsetY = (availableHeight + buildingHeightPixels) / 2;
            
            drawBuilding(offsetX, offsetY, scale);
        }
        
        function drawBuilding(offsetX, offsetY, scale) {
            const width = params.width * scale;
            const length = params.length * scale;
            const wallHeight = params.height * scale;
            const wainscottHeight = params.wainscottHeight * scale;
            const roofPeak = (params.width / 2) * (params.pitch / 12) * scale;
            
            const rotYRad = (params.rotationY * Math.PI) / 180;
            const rotXRad = (params.rotationX * Math.PI) / 180;
            const isoAngle = Math.PI / 6;
            
            const project = (x, y, z) => {
                // Rotate around Y axis (horizontal spin)
                let rotX = x * Math.cos(rotYRad) - y * Math.sin(rotYRad);
                let rotY = x * Math.sin(rotYRad) + y * Math.cos(rotYRad);
                let rotZ = z;
                
                // Rotate around X axis (vertical tilt)
                const tempY = rotY;
                const tempZ = rotZ;
                rotY = tempY * Math.cos(rotXRad) - tempZ * Math.sin(rotXRad);
                rotZ = tempY * Math.sin(rotXRad) + tempZ * Math.cos(rotXRad);
                
                // Isometric projection - CURRENT: using +rotZ
                const isoX = rotX * Math.cos(isoAngle) - rotY * Math.cos(isoAngle);
                const isoY = rotX * Math.sin(isoAngle) + rotY * Math.sin(isoAngle) + rotZ;
                
                return { x: offsetX + isoX, y: offsetY + isoY };
            };
            
            // Building corners
            const fbl = project(-width/2, -length/2, 0);
            const fbr = project(width/2, -length/2, 0);
            const bbl = project(-width/2, length/2, 0);
            const bbr = project(width/2, length/2, 0);
            const ftl = project(-width/2, -length/2, -wallHeight);
            const ftr = project(width/2, -length/2, -wallHeight);
            const btl = project(-width/2, length/2, -wallHeight);
            const btr = project(width/2, length/2, -wallHeight);
            const fwl = project(-width/2, -length/2, -wainscottHeight);
            const fwr = project(width/2, -length/2, -wainscottHeight);
            const bwl = project(-width/2, length/2, -wainscottHeight);
            const bwr = project(width/2, length/2, -wainscottHeight);
            const frontPeak = project(0, -length/2, -wallHeight - roofPeak);
            const backPeak = project(0, length/2, -wallHeight - roofPeak);
            
            const rot = params.rotationY % 360;
            const showFront = rot >= 315 || rot < 135;
            const showBack = rot >= 135 && rot < 315;
            const showLeft = rot >= 45 && rot < 225;
            const showRight = rot >= 225 || rot < 45;
            
            const faces = [];
            
            // Back wall
            if (showBack) {
                faces.push({ points: [bbl, bbr, btr, btl], color: '#E0E0E0', depth: 2 });
                if (params.wainscottEnabled) {
                    faces.push({ points: [bbl, bbr, bwr, bwl], color: '#8B7355', depth: 2.1 });
                }
                faces.push({ points: [btl, btr, backPeak], color: '#E0E0E0', depth: 2.2 });
            }
            
            // Right wall
            if (showRight) {
                faces.push({ points: [fbr, bbr, btr, ftr], color: '#CCCCCC', depth: 1.5 });
                if (params.wainscottEnabled) {
                    faces.push({ points: [fbr, bbr, bwr, fwr], color: '#75614A', depth: 1.6 });
                }
            }
            
            // Left wall
            if (showLeft) {
                faces.push({ points: [bbl, fbl, ftl, btl], color: '#CCCCCC', depth: 1.5 });
                if (params.wainscottEnabled) {
                    faces.push({ points: [bbl, fbl, fwl, bwl], color: '#75614A', depth: 1.6 });
                }
            }
            
            // Front wall
            if (showFront) {
                faces.push({ points: [fbl, fbr, ftr, ftl], color: '#E0E0E0', depth: 1 });
                if (params.wainscottEnabled) {
                    faces.push({ points: [fbl, fbr, fwr, fwl], color: '#8B7355', depth: 1.1 });
                }
                faces.push({ points: [ftl, ftr, frontPeak], color: '#E0E0E0', depth: 0.9 });
            }
            
            // Roof
            faces.push({ points: [ftl, frontPeak, backPeak, btl], color: '#5A5A5A', depth: 0.5 });
            faces.push({ points: [ftr, frontPeak, backPeak, btr], color: '#3A3A3A', depth: 0.5 });
            
            // Sort and draw
            faces.sort((a, b) => b.depth - a.depth);
            faces.forEach(face => drawFace(face.points, face.color));
            
            // Ridge line
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(frontPeak.x, frontPeak.y);
            ctx.lineTo(backPeak.x, backPeak.y);
            ctx.stroke();
        }
        
        function drawFace(points, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1;
            ctx.stroke();
        }
        
        // Event listeners
        document.getElementById('rotation-y').addEventListener('input', (e) => update('rotationY', e.target.value));
        document.getElementById('rotation-x').addEventListener('input', (e) => update('rotationX', e.target.value));
        document.getElementById('zoom').addEventListener('input', (e) => update('zoom', e.target.value));
        
        render();
    </script>
</body>
</html>
