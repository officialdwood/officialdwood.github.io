<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building Visualizer - Demo</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body style="margin: 0; padding: 20px; background: #f0f0f0; font-family: Arial, sans-serif;">
    
    <div class="bv-wrap" data-version="1.0.0">
        <div class="bv-header">
            <h2>Building Visualizer</h2>
            <p>Customize your building and see it come to life!</p>
        </div>
        
        <div class="bv-container">
            <div class="bv-controls">
                <div class="bv-section">
                    <h3>Dimensions</h3>
                    <div class="bv-control-group">
                        <label for="bv-width">Width (feet)</label>
                        <input type="number" id="bv-width" value="20" min="10" max="100" step="1" />
                    </div>
                    <div class="bv-control-group">
                        <label for="bv-length">Length (feet)</label>
                        <input type="number" id="bv-length" value="40" min="10" max="100" step="1" />
                    </div>
                    <div class="bv-control-group">
                        <label for="bv-wall-height">Wall Height (feet)</label>
                        <input type="number" id="bv-wall-height" value="12" min="8" max="20" step="1" />
                    </div>
                    <div class="bv-control-group">
                        <label for="bv-roof-pitch">Roof Pitch (rise per 12")</label>
                        <input type="number" id="bv-roof-pitch" value="4" min="1" max="12" step="0.5" />
                    </div>
                </div>
                
                <div class="bv-section">
                    <h3>Colors</h3>
                    <div class="bv-control-group">
                        <label for="bv-roofing-color">Roofing Color</label>
                        <select id="bv-roofing-color">
                            <!-- Populated by JavaScript -->
                        </select>
                    </div>
                    <div class="bv-control-group">
                        <label for="bv-siding-color">Siding Color</label>
                        <select id="bv-siding-color">
                            <!-- Populated by JavaScript -->
                        </select>
                    </div>
                    <div class="bv-control-group">
                        <label for="bv-wainscott-color">Wainscott Color</label>
                        <select id="bv-wainscott-color">
                            <!-- Populated by JavaScript -->
                        </select>
                    </div>
                </div>
                
                <div class="bv-section">
                    <h3>Actions</h3>
                    <button id="bv-download" class="bv-button primary">Download Image</button>
                </div>
            </div>
            
            <div class="bv-preview">
                <canvas id="bv-canvas" width="800" height="600"></canvas>
                <div class="bv-info">
                    <div class="bv-info-item">
                        <strong>Building Size:</strong> <span id="bv-info-size">-</span>
                    </div>
                    <div class="bv-info-item">
                        <strong>Wall Height:</strong> <span id="bv-info-wall">-</span>
                    </div>
                    <div class="bv-info-item">
                        <strong>Roof Pitch:</strong> <span id="bv-info-pitch">-</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Simulate WordPress localized script
        var BVConfig = {
            version: "1.0.0",
            colors: {
                roofing: [
                    {name: 'Charcoal', rgb: '54,69,79'},
                    {name: 'Barn Red', rgb: '139,26,33'},
                    {name: 'Evergreen', rgb: '34,94,68'}
                ],
                siding: [
                    {name: 'White', rgb: '245,245,245'},
                    {name: 'Tan', rgb: '210,180,140'},
                    {name: 'Gray', rgb: '128,128,128'}
                ],
                wainscott: [
                    {name: 'Brown', rgb: '101,67,33'},
                    {name: 'Black', rgb: '30,30,30'},
                    {name: 'Dark Gray', rgb: '64,64,64'}
                ]
            }
        };
    </script>
    <script src="assets/js/app.js"></script>
    
</body>
</html>
